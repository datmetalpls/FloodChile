<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="hydroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b18"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#040813"/>
    </linearGradient>

    <!-- Glass Panels -->
    <linearGradient id="hydroGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hydroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Shaded conceptual upper scenario area; not a calibrated probability band. -->
    <linearGradient id="p90Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Mountain Orography Shading -->
    <linearGradient id="mountainShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warning Stripe Pattern for Debris Flow Zone -->
    <pattern id="warningStripes" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#f97316" stroke-width="6" stroke-opacity="0.25"/>
    </pattern>

    <!-- Filters -->
    <filter id="hydroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="hydroShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#hydroBg)" rx="20"/>

  <!-- Window Chrome Frame -->
  <rect x="30" y="22" width="1140" height="656" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Bar -->
  <g transform="translate(30, 22)">
    <rect width="1140" height="64" rx="16" fill="#0b1120" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window buttons -->
    <circle cx="30" cy="32" r="6" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="50" cy="32" r="6" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="70" cy="32" r="6" fill="#10b981" fill-opacity="0.8"/>

    <text x="96" y="37" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="16">Física Hidrometeorológica · Escenarios Ilustrativos e Isoterma 0 °C</text>

    <!-- Badge -->
    <rect x="890" y="18" width="220" height="28" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="906" y="36" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Diseño conceptual · no son datos actuales</text>
  </g>

  <!-- LEFT CARD: Probabilistic Rainfall Uncertainty Envelope -->
  <g transform="translate(50, 106)">
    <rect width="520" height="460" rx="14" fill="url(#hydroGlass)" stroke="url(#hydroBorder)" stroke-width="1.2" filter="url(#hydroShadow)"/>
    <rect width="520" height="46" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    
    <text x="20" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="13.5">Pronóstico y Escenarios Ilustrativos (48h)</text>
    <rect x="360" y="12" width="140" height="22" rx="5" fill="#0b132b" stroke="#334155"/>
    <text x="372" y="27" fill="#38bdf8" font-family="monospace" font-size="10.5">Cuenca del Río Maipo</text>

    <!-- Chart Stage Area -->
    <g transform="translate(24, 60)">
      <!-- Y-Axis Grid Lines & Labels -->
      <line x1="50" y1="40" x2="460" y2="40" stroke="#1e293b"/>
      <text x="12" y="44" fill="#64748b" font-family="monospace" font-size="10.5">25 mm</text>

      <line x1="50" y1="110" x2="460" y2="110" stroke="#1e293b"/>
      <text x="12" y="114" fill="#64748b" font-family="monospace" font-size="10.5">18 mm</text>

      <line x1="50" y1="180" x2="460" y2="180" stroke="#1e293b"/>
      <text x="12" y="184" fill="#64748b" font-family="monospace" font-size="10.5">10 mm</text>

      <line x1="50" y1="250" x2="460" y2="250" stroke="#334155"/>
      <text x="16" y="254" fill="#64748b" font-family="monospace" font-size="10.5">0 mm</text>

      <!-- Illustrative upper-scenario area -->
      <path d="M 60 250 Q 130 240 180 140 Q 230 35 280 80 Q 350 200 450 248 L 450 250 L 60 250 Z" fill="url(#p90Gradient)"/>

      <!-- Illustrative upper-scenario curve -->
      <path d="M 60 250 Q 130 240 180 140 Q 230 35 280 80 Q 350 200 450 248" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5,3" filter="url(#hydroGlow)"/>

      <!-- Illustrative base forecast curve -->
      <path d="M 60 250 Q 130 245 180 180 Q 230 95 280 135 Q 350 220 450 250" fill="none" stroke="#10b981" stroke-width="3.2"/>

      <!-- Illustrative lower scenario curve -->
      <path d="M 60 250 Q 130 248 180 220 Q 230 160 280 190 Q 350 238 450 250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- Peak Callout Marker at +14h -->
      <g transform="translate(230, 95)">
        <circle cx="0" cy="0" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="155" stroke="#10b981" stroke-dasharray="2,2"/>
        <!-- Callout box -->
        <g transform="translate(10, -50)">
          <rect width="160" height="44" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="1.2"/>
          <text x="10" y="18" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Pico ilustrativo (+14h)</text>
          <text x="10" y="34" fill="#ffffff" font-family="monospace" font-weight="700" font-size="10.5">Base: 14.8 mm · Alto: 22.4 mm</text>
        </g>
      </g>

      <!-- X-Axis Timestamps -->
      <text x="60" y="275" fill="#64748b" font-family="monospace" font-size="10">+0h</text>
      <text x="150" y="275" fill="#64748b" font-family="monospace" font-size="10">+8h</text>
      <text x="220" y="275" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="10">+14h (Pico)</text>
      <text x="310" y="275" fill="#64748b" font-family="monospace" font-size="10">+24h</text>
      <text x="430" y="275" fill="#64748b" font-family="monospace" font-size="10">+48h</text>
    </g>

    <!-- Legend Footer inside Card -->
    <g transform="translate(30, 385)">
      <rect width="460" height="50" rx="8" fill="#0a101f" stroke="#1e293b"/>
      
      <line x1="20" y1="25" x2="50" y2="25" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5,3"/>
      <text x="58" y="29" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Escenario alto</text>

      <line x1="185" y1="25" x2="215" y2="25" stroke="#10b981" stroke-width="3.2"/>
      <text x="223" y="29" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Pronóstico base</text>

      <line x1="330" y1="25" x2="360" y2="25" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="368" y="29" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Escenario bajo</text>
    </g>
  </g>

  <!-- RIGHT CARD: Andean Orographic Profile & Isotherm 0°C Physics -->
  <g transform="translate(630, 106)">
    <rect width="520" height="460" rx="14" fill="url(#hydroGlass)" stroke="url(#hydroBorder)" stroke-width="1.2" filter="url(#hydroShadow)"/>
    <rect width="520" height="46" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    
    <text x="20" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="13.5">Física Aluvional: Relieve Cordillerano vs. Isoterma 0 °C</text>
    <rect x="420" y="12" width="80" height="22" rx="5" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
    <text x="432" y="27" fill="#f87171" font-family="monospace" font-weight="700" font-size="10.5">⚠️ ALERTA</text>

    <!-- Topographic Cross-Section Stage -->
    <g transform="translate(24, 60)">
      <!-- Elevation Altitude Markers -->
      <line x1="60" y1="40" x2="470" y2="40" stroke="#1e293b"/>
      <text x="12" y="44" fill="#64748b" font-family="monospace" font-size="10">4.500 m</text>

      <line x1="60" y1="100" x2="470" y2="100" stroke="#ef4444" stroke-width="1.8" filter="url(#hydroGlow)"/>
      <text x="12" y="104" fill="#f87171" font-family="monospace" font-weight="800" font-size="10.5">3.200 m</text>

      <line x1="60" y1="165" x2="470" y2="165" stroke="#38bdf8" stroke-dasharray="4,4"/>
      <text x="12" y="169" fill="#38bdf8" font-family="monospace" font-size="10">2.100 m</text>

      <line x1="60" y1="250" x2="470" y2="250" stroke="#334155"/>
      <text x="18" y="254" fill="#64748b" font-family="monospace" font-size="10">0 m (Mar)</text>

      <!-- Realistic Cross Section: Pacific -> Coastal Range -> Central Valley -> High Andes -->
      <path d="M 60 250 L 110 245 L 150 190 L 180 230 L 220 230 L 270 170 L 330 110 L 390 40 L 440 80 L 470 140 L 470 250 Z" fill="url(#mountainShade)"/>

      <!-- Liquid Rain Infiltration & Debris Flow Zone (Hatched Stripes between 2.100m and 3.200m) -->
      <path d="M 235 208 L 270 170 L 330 110 L 340 100 L 415 100 L 390 40 L 330 110 L 270 170 Z" fill="url(#warningStripes)"/>

      <!-- Topography Place Labels -->
      <text x="65" y="240" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5">Océano Pacífico</text>
      <text x="135" y="180" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9">C. Costa</text>
      <text x="185" y="245" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5">Valle Central</text>
      <text x="365" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Cordillera de los Andes</text>

      <!-- Elevated Freezing Level Banner -->
      <g transform="translate(180, 88)">
        <rect width="210" height="24" rx="5" fill="#ef4444" filter="url(#hydroGlow)"/>
        <text x="12" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="10.5">ISOTERMA 0 °C ELEVADA (3.200 m)</text>
      </g>

      <!-- Normal Freezing Level Banner -->
      <g transform="translate(180, 154)">
        <rect width="190" height="22" rx="4" fill="#0f172a" stroke="#38bdf8"/>
        <text x="10" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="600" font-size="10">Isoterma invernal normal (2.100 m)</text>
      </g>

      <!-- Atmospheric River Moisture Arrow hitting Mountain -->
      <g transform="translate(100, 140)">
        <path d="M 0 0 Q 70 -30 140 -5" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
        <polygon points="138,-9 146,-4 138,0" fill="#f59e0b"/>
        <text x="15" y="-18" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="10">Río Atmosférico Cálido</text>
      </g>
    </g>

    <!-- Physics Warning Box inside Card -->
    <g transform="translate(30, 360)">
      <rect width="460" height="75" rx="8" fill="#0a101f" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="8" fill="#ef4444" fill-opacity="0.2"/>
      <text x="18" y="26" fill="#ef4444" font-family="sans-serif" font-weight="900" font-size="12">⚠️</text>
      <text x="38" y="24" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5">Mecanismo de Desprendimiento Aluvional</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Precipitación líquida sobre 1.100 m de terreno con material suelto y ceniza</text>
      <text x="16" y="60" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Descongelamiento de nieve previa + saturación rápida de quebradas andinas</text>
    </g>
  </g>

  <!-- Bottom Epistemic Honesty Banner -->
  <g transform="translate(50, 592)">
    <rect width="1100" height="66" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="34" cy="33" r="12" fill="#10b981" fill-opacity="0.15"/>
    <text x="29" y="38" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="14">🛡</text>
    <text x="56" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="800" font-size="12">Invariante de Honestidad Epistémica de FloodChile:</text>
    <text x="56" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Ilustración conceptual, no datos actuales ni bandas estadísticas. Para alertas oficiales, consultar fuentes institucionales; la supervisión humana es obligatoria.</text>
  </g>
</svg>
