<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="p90Band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="andesRelief" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="580" fill="url(#chartBg)" rx="16"/>

  <!-- Title -->
  <text x="40" y="44" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="13" letter-spacing="2">MODELO HIDROMETEOROLÓGICO Y RIESGO ALUVIONAL</text>
  <text x="40" y="74" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22">Pronóstico Probabilístico (P10–P50–P90) e Isoterma 0 °C Andina</text>

  <!-- Left: Hydro Probabilistic Chart (Hourly Rain mm/h) -->
  <g transform="translate(40, 100)">
    <rect width="450" height="380" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="32" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="13">Banda de Incertidumbre de Lluvia (48h)</text>
    <text x="24" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Cuenca del Río Maipo (San José de Maipo / RM)</text>

    <!-- Grid lines -->
    <line x1="60" y1="90" x2="410" y2="90" stroke="#1e293b"/>
    <line x1="60" y1="160" x2="410" y2="160" stroke="#1e293b"/>
    <line x1="60" y1="230" x2="410" y2="230" stroke="#1e293b"/>
    <line x1="60" y1="300" x2="410" y2="300" stroke="#334155"/>

    <text x="24" y="94" fill="#64748b" font-family="monospace" font-size="10">25 mm</text>
    <text x="24" y="164" fill="#64748b" font-family="monospace" font-size="10">15 mm</text>
    <text x="24" y="234" fill="#64748b" font-family="monospace" font-size="10">5 mm</text>
    <text x="28" y="304" fill="#64748b" font-family="monospace" font-size="10">0 mm</text>

    <!-- P90 Uncertainty Envelope Area -->
    <path d="M 70 300 Q 130 290 180 180 Q 240 70 290 120 Q 350 240 400 295 L 400 300 L 70 300 Z" fill="url(#p90Band)"/>

    <!-- P90 Curve (Worst Case) -->
    <path d="M 70 300 Q 130 290 180 180 Q 240 70 290 120 Q 350 240 400 295" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,3"/>

    <!-- P50 Curve (Median Expected) -->
    <path d="M 70 300 Q 130 295 180 220 Q 240 140 290 180 Q 350 265 400 300" fill="none" stroke="#10b981" stroke-width="2.8"/>

    <!-- P10 Curve (Conservative Minimum) -->
    <path d="M 70 300 Q 130 298 180 260 Q 240 210 290 240 Q 350 285 400 300" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2"/>

    <!-- Legend -->
    <line x1="70" y1="340" x2="100" y2="340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="108" y="344" fill="#38bdf8" font-family="sans-serif" font-size="10.5">P90 (Máximo plausible)</text>

    <line x1="210" y1="340" x2="240" y2="340" stroke="#10b981" stroke-width="2.8"/>
    <text x="248" y="344" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="10.5">P50 (Mediana)</text>

    <line x1="330" y1="340" x2="360" y2="340" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2"/>
    <text x="368" y="344" fill="#94a3b8" font-family="sans-serif" font-size="10.5">P10 (Mínimo)</text>
  </g>

  <!-- Right: Andes Cross Section & 0°C Freezing Line (Risk of Debris Flow) -->
  <g transform="translate(510, 100)">
    <rect width="450" height="380" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="32" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="13">Isoterma 0 °C vs. Relieve Cordillerano</text>
    <text x="24" y="48" fill="#f87171" font-family="sans-serif" font-weight="600" font-size="10.5">Riesgo Aluvional: Lluvia líquida en zona no consolidada</text>

    <!-- Mountain profile -->
    <path d="M 50 300 L 120 280 L 190 220 L 260 160 L 330 90 L 370 140 L 410 220 L 410 300 Z" fill="url(#andesRelief)"/>

    <!-- Normal Freezing level line (2.200m) -->
    <line x1="50" y1="210" x2="410" y2="210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="56" y="204" fill="#94a3b8" font-family="sans-serif" font-size="10">Isoterma invernal normal (~2.200 m)</text>

    <!-- Warm Atmospheric River Freezing level line (3.200m) -->
    <line x1="50" y1="130" x2="410" y2="130" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="230" y="118" width="165" height="22" rx="4" fill="#ef4444"/>
    <text x="238" y="133" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="10.5">⚠️ ISOTERMA ALTA (3.200 m)</text>

    <!-- Liquid rain zone in mountain -->
    <rect x="210" y="150" width="180" height="52" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#f97316"/>
    <text x="220" y="170" fill="#fbbf24" font-family="sans-serif" font-weight="700" font-size="10">Zona de Lluvia Líquida</text>
    <text x="220" y="186" fill="#fcd34d" font-family="sans-serif" font-size="9.5">Descongelamiento + arrastre de sedimento</text>

    <!-- Explanation Box -->
    <rect x="24" y="270" width="402" height="90" rx="8" fill="#1e293b"/>
    <text x="38" y="294" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="11.5">Monitoreo Automatizado de Umbrales Críticos</text>
    <text x="38" y="314" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Alerta si Isoterma 0 °C &gt; 3.000 m con precipitación estimada &gt; 30 mm/24h</text>
    <text x="38" y="332" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Estimación preventiva de crecida fluvial mediante GloFAS (m³/s)</text>
    <text x="38" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Citas trazables y revisión humana (HITL) para recomendaciones críticas</text>
  </g>

  <!-- Bottom Bar: Status -->
  <rect x="40" y="500" width="920" height="56" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="60" y="534" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="12">✓ Principio de Honestidad Epistémica:</text>
  <text x="330" y="534" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">No simular certezas donde hay dispersión de ensambles (ECMWF, GFS, ICON).</text>
</svg>
