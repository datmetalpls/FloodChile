<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="ambientCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>

    <!-- Glassmorphism Card Shaders -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glowing Lines and Badges -->
    <linearGradient id="flowGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="flowGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardDropShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Deep Dark Background with Mesh Glow -->
  <rect width="1200" height="700" fill="url(#bgGrad)" rx="20"/>
  <rect width="1200" height="700" fill="url(#dotGrid)" rx="20"/>
  <rect width="1200" height="700" fill="url(#ambientCyan)" rx="20"/>
  <rect width="1200" height="700" fill="url(#ambientPurple)" rx="20"/>

  <!-- Window Chrome Frame (macOS Dark Aesthetic) -->
  <rect x="30" y="24" width="1140" height="652" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Bar -->
  <g transform="translate(30, 24)">
    <rect width="1140" height="60" rx="16" fill="#0f172a" fill-opacity="0.75"/>
    <!-- Window buttons -->
    <circle cx="32" cy="30" r="6" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="52" cy="30" r="6" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="72" cy="30" r="6" fill="#10b981" fill-opacity="0.85"/>

    <text x="100" y="35" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="0.5">FloodChile · Arquitectura de Datos y Motor Operacional</text>

    <!-- Status Pills -->
    <rect x="850" y="18" width="130" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="866" cy="31" r="4" fill="#10b981" filter="url(#softGlow)"/>
    <text x="878" y="35" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">PRODUCCIÓN 100%</text>

    <rect x="992" y="18" width="124" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="1006" y="35" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="11">CERO DEPENDENCIAS</text>
  </g>

  <!-- COLUMN 1: Fuentes de Datos Internacionales -->
  <g transform="translate(60, 110)">
    <rect width="320" height="530" rx="14" fill="url(#glassCard)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardDropShadow)"/>
    
    <!-- Column Header -->
    <rect width="320" height="50" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="28" cy="25" r="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="23" y="30" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="13">📡</text>
    <text x="48" y="29" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">1. Ingesta de Sensores &amp; APIs</text>
    <rect x="235" y="14" width="70" height="22" rx="6" fill="#0b132b" stroke="#334155"/>
    <text x="246" y="29" fill="#94a3b8" font-family="monospace" font-size="10.5">Globales</text>

    <!-- Source Card 1 -->
    <g transform="translate(18, 68)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">Open-Meteo Weather API</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Pronóstico de lluvia, T°, viento a 10 m,</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Isoterma 0 °C horaria (+72h) y 7 días</text>
      <rect x="206" y="16" width="64" height="18" rx="4" fill="#0284c7" fill-opacity="0.15"/>
      <text x="214" y="29" fill="#38bdf8" font-family="monospace" font-size="9.5">ECMWF/GFS</text>
    </g>

    <!-- Source Card 2 -->
    <g transform="translate(18, 172)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">GloFAS River Discharge</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Caudal fluvial modelado (m³/s),</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">umbrales de desborde y aluviones</text>
      <rect x="214" y="16" width="56" height="18" rx="4" fill="#059669" fill-opacity="0.15"/>
      <text x="222" y="29" fill="#34d399" font-family="monospace" font-size="9.5">Copernicus</text>
    </g>

    <!-- Source Card 3 -->
    <g transform="translate(18, 276)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">NASA GIBS WMTS (epsg3857)</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">GOES-East Banda 13 IR Limpio y</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Suomi NPP VIIRS Color Verdadero</text>
      <rect x="224" y="16" width="46" height="18" rx="4" fill="#d97706" fill-opacity="0.15"/>
      <text x="230" y="29" fill="#fbbf24" font-family="monospace" font-size="9.5">NOAA</text>
    </g>

    <!-- Source Card 4 -->
    <g transform="translate(18, 380)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#ec4899" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#f472b6" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">RainViewer &amp; Open-Meteo Marine</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Radar de tormentas en vivo y altura</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">de ola / oleaje costero (m)</text>
      <rect x="210" y="16" width="60" height="18" rx="4" fill="#db2777" fill-opacity="0.15"/>
      <text x="218" y="29" fill="#f472b6" font-family="monospace" font-size="9.5">En tiempo real</text>
    </g>

    <!-- Footer metadata badge -->
    <text x="24" y="502" fill="#64748b" font-family="monospace" font-size="10.5">● Conexión segura TLS 1.3 · Sin claves requeridas</text>
  </g>

  <!-- COLUMN 2: Servidor Node.js Nativo y Caché TTL -->
  <g transform="translate(440, 110)">
    <rect width="320" height="530" rx="14" fill="url(#glassCard)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardDropShadow)"/>
    
    <rect width="320" height="50" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="28" cy="25" r="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="23" y="30" fill="#10b981" font-family="sans-serif" font-weight="900" font-size="13">⚡</text>
    <text x="48" y="29" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">2. Motor Backend Node.js</text>
    <rect x="235" y="14" width="70" height="22" rx="6" fill="#0b132b" stroke="#334155"/>
    <text x="248" y="29" fill="#34d399" font-family="monospace" font-size="10.5">:4173</text>

    <!-- Server Module 1 -->
    <g transform="translate(18, 68)">
      <rect width="284" height="126" rx="10" fill="#0a101f" stroke="#10b981" stroke-width="1.2"/>
      <text x="16" y="28" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Proxy con Caché TTL en Memoria</text>
      <rect x="16" y="36" width="252" height="24" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="52" fill="#38bdf8" font-family="monospace" font-size="10.5">GET /api/open-meteo/sync?loc=id</text>
      <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• TTL de 15 min evita rate limits y bloqueos IP</text>
      <text x="16" y="98" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Ingesta concurrente (4 slots) para 15 comunas</text>
      <text x="16" y="116" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Fallback directo en cliente si el proxy no responde</text>
    </g>

    <!-- Server Module 2 -->
    <g transform="translate(18, 210)">
      <rect width="284" height="126" rx="10" fill="#0a101f" stroke="#818cf8" stroke-width="1.2"/>
      <text x="16" y="28" fill="#818cf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Generador GeoJSON Dinámico</text>
      <rect x="16" y="36" width="252" height="24" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="52" fill="#c084fc" font-family="monospace" font-size="10.5">GET /api/carto/chile-meteo.geojson</text>
      <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• FeatureCollection de 15 puntos nacionales</text>
      <text x="16" y="98" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Compatible con CARTO Builder, QGIS y ArcGIS</text>
      <text x="16" y="116" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Sanitización estricta XSS de propiedades</text>
    </g>

    <!-- Server Module 3 -->
    <g transform="translate(18, 352)">
      <rect width="284" height="116" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Servidor HTTP Nativo &amp; PWA</text>
      <text x="16" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Servidor de estáticos ultraliviano (~7 KB)</text>
      <text x="16" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Cero dependencias npm en node_modules</text>
      <text x="16" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Entrega de manifest.json y sw.js offline</text>
      <text x="16" y="106" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Headers de seguridad y compresión</text>
    </g>

    <text x="24" y="502" fill="#64748b" font-family="monospace" font-size="10.5">● Runtime: Node.js 18+ ES Modules nativos</text>
  </g>

  <!-- COLUMN 3: Cliente Frontend PWA & Map Engine -->
  <g transform="translate(820, 110)">
    <rect width="320" height="530" rx="14" fill="url(#glassCard)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardDropShadow)"/>
    
    <rect width="320" height="50" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="28" cy="25" r="10" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="23" y="30" fill="#f43f5e" font-family="sans-serif" font-weight="900" font-size="13">💻</text>
    <text x="48" y="29" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">3. Cliente PWA &amp; Visualizador</text>
    <rect x="235" y="14" width="70" height="22" rx="6" fill="#0b132b" stroke="#334155"/>
    <text x="246" y="29" fill="#f43f5e" font-family="monospace" font-size="10.5">Offline</text>

    <!-- Client Module 1 -->
    <g transform="translate(18, 68)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">Mapa Nacional (Leaflet + Canvas)</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">6 capas con scrubber (+0h..+72h),</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">reutilización de marcadores sin lag</text>
      <rect x="214" y="16" width="56" height="18" rx="4" fill="#0284c7" fill-opacity="0.15"/>
      <text x="222" y="29" fill="#38bdf8" font-family="monospace" font-size="9.5">60 FPS</text>
    </g>

    <!-- Client Module 2 -->
    <g transform="translate(18, 172)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">Visor Satelital Antes / Ahora</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Cortina interactiva táctil/mouse con</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Banda 13 IR, VIIRS y topes convectivos</text>
      <rect x="206" y="16" width="64" height="18" rx="4" fill="#d97706" fill-opacity="0.15"/>
      <text x="214" y="29" fill="#fbbf24" font-family="monospace" font-size="9.5">Split View</text>
    </g>

    <!-- Client Module 3 -->
    <g transform="translate(18, 276)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">Honestidad Epistémica &amp; Alertas</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Alertas oficiales SENAPRED vs umbrales,</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">modos Ciudadano / Técnico y citas HITL</text>
      <rect x="218" y="16" width="52" height="18" rx="4" fill="#059669" fill-opacity="0.15"/>
      <text x="226" y="29" fill="#34d399" font-family="monospace" font-size="9.5">CA-01..09</text>
    </g>

    <!-- Client Module 4 -->
    <g transform="translate(18, 380)">
      <rect width="284" height="88" rx="10" fill="#0a101f" stroke="#1e293b"/>
      <circle cx="22" cy="24" r="8" fill="#818cf8" fill-opacity="0.2"/>
      <text x="38" y="28" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">PWA, Buscador &amp; Deep Linking</text>
      <text x="16" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Buscador instantáneo de comunas/cuencas,</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">"Cerca de mí" y URLs compartibles</text>
      <rect x="220" y="16" width="50" height="18" rx="4" fill="#4f46e5" fill-opacity="0.15"/>
      <text x="228" y="29" fill="#a5b4fc" font-family="monospace" font-size="9.5">PWA SW</text>
    </g>

    <text x="24" y="502" fill="#64748b" font-family="monospace" font-size="10.5">● Funciona sin conexión ante cortes de red</text>
  </g>

  <!-- Glowing Animated-style Pipeline Connectors -->
  <!-- Connector 1 -> 2 -->
  <path d="M 380 230 C 410 230, 410 230, 440 230" fill="none" stroke="url(#flowGlow1)" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#softGlow)"/>
  <circle cx="410" cy="230" r="4" fill="#38bdf8"/>

  <path d="M 380 340 C 410 340, 410 260, 440 260" fill="none" stroke="url(#flowGlow1)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="410" cy="300" r="4" fill="#34d399"/>

  <path d="M 380 440 C 410 440, 410 290, 440 290" fill="none" stroke="url(#flowGlow1)" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Connector 2 -> 3 -->
  <path d="M 760 230 C 790 230, 790 230, 820 230" fill="none" stroke="url(#flowGlow2)" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#softGlow)"/>
  <circle cx="790" cy="230" r="4" fill="#10b981"/>

  <path d="M 760 330 C 790 330, 790 330, 820 330" fill="none" stroke="url(#flowGlow2)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="790" cy="330" r="4" fill="#818cf8"/>

  <path d="M 760 430 C 790 430, 790 430, 820 430" fill="none" stroke="url(#flowGlow2)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="790" cy="430" r="4" fill="#a5b4fc"/>
</svg>
