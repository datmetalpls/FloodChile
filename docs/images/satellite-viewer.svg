<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="satBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="cloudPast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cloudNow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#facc15" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tempBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="580" fill="url(#satBg)" rx="16"/>

  <!-- Header -->
  <text x="40" y="44" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="13" letter-spacing="2">VISOR SATELITAL OPERACIONAL</text>
  <text x="40" y="74" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22">Cortina Interactiva Antes / Ahora y Mosaicos NASA GIBS en Vivo</text>

  <!-- Left Side: Past Frame (Hace 3h) -->
  <g clip-path="url(#leftClip)">
    <clipPath id="leftClip">
      <rect x="40" y="100" width="460" height="400" rx="10"/>
    </clipPath>
    <rect x="40" y="100" width="920" height="400" fill="#040b16"/>
    <!-- Past Cloud Mass shifted offshore -->
    <ellipse cx="260" cy="280" rx="190" ry="110" transform="rotate(-25, 260, 280)" fill="url(#cloudPast)"/>
    <ellipse cx="220" cy="350" rx="140" ry="80" transform="rotate(-30, 220, 350)" fill="url(#cloudPast)"/>
  </g>

  <!-- Right Side: Current Frame (Actual) -->
  <g clip-path="url(#rightClip)">
    <clipPath id="rightClip">
      <rect x="500" y="100" width="460" height="400" rx="10"/>
    </clipPath>
    <rect x="40" y="100" width="920" height="400" fill="#050a14"/>
    <!-- Current Cloud Mass over mainland -->
    <ellipse cx="560" cy="270" rx="230" ry="100" transform="rotate(-28, 560, 270)" fill="url(#cloudNow)"/>
    <ellipse cx="610" cy="330" rx="180" ry="90" transform="rotate(-32, 610, 330)" fill="url(#cloudNow)"/>
  </g>

  <!-- Outline frame -->
  <rect x="40" y="100" width="920" height="400" rx="10" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Chile coast outline silhouette across the split -->
  <path d="M 620 120 Q 610 200 625 280 Q 640 370 660 480" fill="none" stroke="#fbbf24" stroke-width="2.2"/>
  <text x="635" y="240" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11">Valparaíso / RM</text>
  <text x="648" y="320" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11">Maule / Biobío</text>

  <!-- Split Divider Line -->
  <line x1="500" y1="100" x2="500" y2="500" stroke="#facc15" stroke-width="3"/>
  <circle cx="500" cy="300" r="18" fill="#facc15"/>
  <text x="494" y="306" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="15">⇄</text>

  <!-- Badges -->
  <rect x="56" y="116" width="230" height="44" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8"/>
  <text x="68" y="134" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="11">ANTES: HACE 3 HORAS</text>
  <text x="68" y="149" fill="#94a3b8" font-family="monospace" font-size="10">Tope IR: -48 °C · IVT: 390 kg/m/s</text>

  <rect x="714" y="116" width="230" height="44" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#facc15"/>
  <text x="726" y="134" fill="#facc15" font-family="sans-serif" font-weight="700" font-size="11">AHORA: IMPACTO FRONTAL</text>
  <text x="726" y="149" fill="#f87171" font-family="monospace" font-weight="700" font-size="10">Tope IR: -57 °C · IVT: 495 kg/m/s</text>

  <!-- Bottom Legend / Color scale -->
  <rect x="40" y="515" width="920" height="44" rx="8" fill="#1e293b"/>
  <text x="60" y="542" fill="#cbd5e1" font-family="sans-serif" font-size="11">Escala de Temperatura de Brillo IR (Banda 13 - GOES-East):</text>
  <rect x="410" y="530" width="360" height="12" rx="4" fill="url(#tempBar)" stroke="#475569"/>
  <text x="410" y="525" fill="#94a3b8" font-family="monospace" font-size="9.5">+20 °C (Cálido/Bajo)</text>
  <text x="560" y="525" fill="#facc15" font-family="monospace" font-size="9.5">-35 °C</text>
  <text x="720" y="525" fill="#f87171" font-family="monospace" font-size="9.5">-70 °C (Tope Convectivo Severo)</text>
  <text x="800" y="542" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="11">NASA GIBS WMTS</text>
</svg>
