<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="satConsoleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050e"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#02050c"/>
    </linearGradient>

    <!-- Cloud Thermal Shaders (Past vs Now) -->
    <radialGradient id="cloudPastSoft" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c192c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudNowSevere" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#dc2626" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#facc15" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Spectral Colorbar Gradient (Brightness Temperature IR) -->
    <linearGradient id="spectralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="92%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="curtainGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="consoleShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Console Background -->
  <rect width="1200" height="700" fill="url(#satConsoleBg)" rx="20"/>

  <!-- Window Chrome Frame -->
  <rect x="30" y="22" width="1140" height="656" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Console Header -->
  <g transform="translate(30, 22)">
    <rect width="1140" height="64" rx="16" fill="#0b1120" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window buttons -->
    <circle cx="30" cy="32" r="6" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="50" cy="32" r="6" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="70" cy="32" r="6" fill="#10b981" fill-opacity="0.8"/>

    <text x="96" y="37" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="16">Consola Satelital Operacional · NOAA GOES-16 &amp; NASA GIBS WMTS</text>

    <!-- Source Selectors -->
    <rect x="760" y="18" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="774" y="36" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🛰 GOES-East Banda 13 IR (En vivo)</text>

    <rect x="990" y="18" width="120" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="1004" y="36" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">VIIRS TrueColor</text>
  </g>

  <!-- Interactive Curtain Screen (Split at 50% = X: 600) -->
  <g transform="translate(50, 106)">
    <!-- Container Frame -->
    <rect width="1100" height="470" rx="14" fill="#040814" stroke="#334155" stroke-width="1.5" filter="url(#consoleShadow)"/>

    <!-- LEFT SIDE: PAST FRAME (t - 3h) - Clipped to Left Half -->
    <g clip-path="url(#leftConsoleClip)">
      <clipPath id="leftConsoleClip">
        <rect x="0" y="0" width="550" height="470" rx="14"/>
      </clipPath>

      <!-- Ocean & Grid -->
      <rect width="1100" height="470" fill="#040b17"/>
      <path d="M 0 120 L 1100 120 M 0 240 L 1100 240 M 0 360 L 1100 360" stroke="#13233a" stroke-dasharray="4,4"/>
      <path d="M 220 0 L 220 470 M 440 0 L 440 470 M 660 0 L 660 470 M 880 0 L 880 470" stroke="#13233a" stroke-dasharray="4,4"/>

      <!-- Frontal Cloud Mass (Past position shifted offshore in Pacific) -->
      <ellipse cx="320" cy="270" rx="220" ry="110" transform="rotate(-28, 320, 270)" fill="url(#cloudPastSoft)" filter="url(#curtainGlow)"/>
      <ellipse cx="260" cy="350" rx="160" ry="80" transform="rotate(-32, 260, 350)" fill="url(#cloudPastSoft)" filter="url(#curtainGlow)"/>

      <!-- Cyclone Vortex Low (Past: 990 hPa) -->
      <ellipse cx="200" cy="360" rx="70" ry="45" fill="none" stroke="#38bdf8" stroke-dasharray="4,4" opacity="0.6"/>
      <text x="175" y="365" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="11">B 990 hPa</text>
    </g>

    <!-- RIGHT SIDE: CURRENT FRAME (t = 0h) - Clipped to Right Half -->
    <g clip-path="url(#rightConsoleClip)">
      <clipPath id="rightConsoleClip">
        <rect x="550" y="0" width="550" height="470" rx="14"/>
      </clipPath>

      <!-- Deep Dark Ocean & Atmosphere -->
      <rect width="1100" height="470" fill="#060d1c"/>
      <path d="M 0 120 L 1100 120 M 0 240 L 1100 240 M 0 360 L 1100 360" stroke="#1e293b" stroke-dasharray="4,4"/>
      <path d="M 220 0 L 220 470 M 440 0 L 440 470 M 660 0 L 660 470 M 880 0 L 880 470" stroke="#1e293b" stroke-dasharray="4,4"/>

      <!-- Violent Frontal Cloud Mass Expanding over Mainland & Andes -->
      <ellipse cx="680" cy="250" rx="260" ry="120" transform="rotate(-26, 680, 250)" fill="url(#cloudNowSevere)" filter="url(#curtainGlow)"/>
      <ellipse cx="730" cy="320" rx="200" ry="90" transform="rotate(-30, 730, 320)" fill="url(#cloudNowSevere)" filter="url(#curtainGlow)"/>

      <!-- Cyclone Core Impacting Coast (984 hPa) -->
      <ellipse cx="590" cy="380" rx="80" ry="50" fill="none" stroke="#ef4444" stroke-dasharray="4,4" opacity="0.8"/>
      <text x="565" y="385" fill="#f87171" font-family="monospace" font-weight="800" font-size="11">B 984 hPa</text>
    </g>

    <!-- Continental Silhouette across the split (South America / Chile Coastline) -->
    <path d="M 720 30 Q 740 160 765 270 Q 790 380 810 470" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 770 30 Q 790 160 820 270 Q 845 380 865 470" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

    <!-- Reference Points -->
    <circle cx="760" cy="225" r="4" fill="#ffffff"/>
    <text x="770" y="229" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Valparaíso / Santiago</text>

    <circle cx="780" cy="310" r="4" fill="#ffffff"/>
    <text x="790" y="314" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Maule / Biobío</text>

    <!-- Split Divider Curtain Bar (Glowing Gold) -->
    <line x1="550" y1="0" x2="550" y2="470" stroke="#facc15" stroke-width="3" filter="url(#curtainGlow)"/>
    
    <!-- Central Interactive Handle Knob -->
    <circle cx="550" cy="235" r="22" fill="#0f172a" stroke="#facc15" stroke-width="3" filter="url(#curtainGlow)"/>
    <circle cx="550" cy="235" r="16" fill="#facc15"/>
    <text x="543" y="242" fill="#0f172a" font-family="-apple-system, sans-serif" font-weight="900" font-size="18">⇄</text>

    <!-- Left Badge (ANTES) -->
    <g transform="translate(24, 20)">
      <rect width="250" height="52" rx="8" fill="#0b132b" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.2" filter="url(#consoleShadow)"/>
      <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
      <text x="28" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="800" font-size="12">ANTES · HACE 3 HORAS (t - 3h)</text>
      <text x="16" y="40" fill="#94a3b8" font-family="monospace" font-size="10.5">Tope IR: -48 °C · IVT: 390 kg/m/s</text>
    </g>

    <!-- Right Badge (AHORA) -->
    <g transform="translate(826, 20)">
      <rect width="250" height="52" rx="8" fill="#0b132b" fill-opacity="0.92" stroke="#facc15" stroke-width="1.2" filter="url(#consoleShadow)"/>
      <circle cx="16" cy="18" r="4" fill="#facc15"/>
      <text x="28" y="22" fill="#facc15" font-family="-apple-system, sans-serif" font-weight="800" font-size="12">AHORA · IMPACTO ACTUAL (t = 0h)</text>
      <text x="16" y="40" fill="#f87171" font-family="monospace" font-weight="700" font-size="10.5">Tope IR: -57.4 °C · IVT: 495 kg/m/s</text>
    </g>
  </g>

  <!-- Bottom Console Status & Brightness Temperature Spectral Scale -->
  <g transform="translate(50, 592)">
    <rect width="1100" height="66" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Colorbar Label -->
    <text x="24" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">Escala Radiométrica Infrarroja (Banda 13 ABI · 10.3 µm):</text>
    <text x="24" y="46" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Topes fríos violáceos corresponden a convección profunda y máxima probabilidad de granizo / lluvia violenta</text>

    <!-- Colorbar Track -->
    <g transform="translate(560, 16)">
      <rect width="510" height="14" rx="4" fill="url(#spectralGrad)" stroke="#334155"/>
      <!-- Scale ticks -->
      <text x="0" y="30" fill="#94a3b8" font-family="monospace" font-size="10">+25 °C (Tierra/Mar cálido)</text>
      <text x="170" y="30" fill="#38bdf8" font-family="monospace" font-size="10">-20 °C</text>
      <text x="290" y="30" fill="#facc15" font-family="monospace" font-size="10">-40 °C</text>
      <text x="400" y="30" fill="#f87171" font-family="monospace" font-weight="700" font-size="10">-60 °C (Severo)</text>
      <text x="480" y="30" fill="#c084fc" font-family="monospace" font-weight="800" font-size="10">-75 °C</text>
    </g>
  </g>
</svg>
