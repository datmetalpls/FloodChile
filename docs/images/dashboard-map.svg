<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050a17"/>
    </linearGradient>
    <linearGradient id="rainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#facc15" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="580" fill="url(#mapBg)" rx="16"/>

  <!-- Top Navigation Bar in App -->
  <rect x="20" y="20" width="960" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="48" cy="48" r="14" fill="#38bdf8"/>
  <text x="43" y="53" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="14">🌧</text>
  <text x="74" y="53" fill="#f8fafc" font-family="sans-serif" font-weight="800" font-size="16">FloodChile</text>
  <rect x="175" y="38" width="86" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="187" y="52" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="10">● EN VIVO 15/15</text>

  <!-- Search & Action buttons mockup -->
  <rect x="290" y="34" width="220" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="306" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">🔍 Buscar comuna o cuenca...</text>

  <rect x="526" y="34" width="100" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="540" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="11">📍 Cerca de mí</text>

  <rect x="636" y="34" width="110" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="648" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="11">🔗 Compartir vista</text>

  <rect x="758" y="34" width="206" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="772" y="52" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="11">Modo Ciudadano ⇄ Técnico</text>

  <!-- Left: Chile Coastline and Overlay Map -->
  <g transform="translate(180, 70)">
    <!-- Simulated Chile Shape -->
    <path d="M 60 40 Q 65 140 85 240 Q 95 320 120 420 Q 140 450 130 480" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round"/>
    <path d="M 60 40 Q 65 140 85 240 Q 95 320 120 420 Q 140 450 130 480" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>

    <!-- Rain / Atmospheric River Layer Overlay -->
    <ellipse cx="90" cy="270" rx="90" ry="40" transform="rotate(-35, 90, 270)" fill="url(#rainGradient)" filter="url(#glow)"/>
    <ellipse cx="110" cy="330" rx="75" ry="32" transform="rotate(-30, 110, 330)" fill="url(#rainGradient)" filter="url(#glow)"/>

    <!-- 0°C Isotherm Contour line -->
    <path d="M 80 180 Q 110 240 125 310 Q 145 380 150 440" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
    <rect x="135" y="295" width="95" height="18" rx="4" fill="#0b132b" stroke="#38bdf8"/>
    <text x="142" y="308" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="9.5">Isoterma 3.050 m</text>

    <!-- Markers -->
    <circle cx="70" cy="90" r="5" fill="#38bdf8"/>
    <text x="82" y="94" fill="#cbd5e1" font-family="sans-serif" font-size="10">Antofagasta</text>

    <circle cx="85" cy="235" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="240" fill="#f87171" font-family="sans-serif" font-weight="700" font-size="11">Santiago (Maipo)</text>

    <circle cx="95" cy="285" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="108" y="290" fill="#fbbf24" font-family="sans-serif" font-weight="600" font-size="10">Talca (Maule)</text>

    <circle cx="105" cy="330" r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <text x="118" y="335" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="10">Concepción (Biobío)</text>

    <circle cx="132" cy="455" r="5" fill="#38bdf8"/>
    <text x="144" y="460" fill="#cbd5e1" font-family="sans-serif" font-size="10">Punta Arenas</text>
  </g>

  <!-- Right Panel: Capas Activas y Métricas Operacionales -->
  <rect x="620" y="96" width="360" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="620" y="96" width="360" height="38" rx="10" fill="#1e293b"/>
  <text x="638" y="120" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="13">Capas de Meteorología Operacional</text>

  <!-- Layer Toggles -->
  <g transform="translate(636, 148)">
    <rect x="0" y="0" width="328" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="21" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="11">✓ 1. Precipitación Acumulada &amp; Río Atmosférico</text>

    <rect x="0" y="42" width="328" height="34" rx="6" fill="#0b132b" stroke="#334155"/>
    <text x="12" y="63" fill="#cbd5e1" font-family="sans-serif" font-size="11">○ 2. Temperatura a 2m y Sensación Térmica</text>

    <rect x="0" y="84" width="328" height="34" rx="6" fill="#0b132b" stroke="#334155"/>
    <text x="12" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="11">○ 3. Viento a 10m y Rachas Máximas</text>

    <rect x="0" y="126" width="328" height="34" rx="6" fill="#0b132b" stroke="#334155"/>
    <text x="12" y="147" fill="#cbd5e1" font-family="sans-serif" font-size="11">○ 4. Nubosidad Baja, Media y Alta</text>

    <rect x="0" y="168" width="328" height="34" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="189" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="11">✓ 5. Nieve e Isoterma 0 °C Andina</text>

    <rect x="0" y="210" width="328" height="34" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <text x="12" y="231" fill="#f87171" font-family="sans-serif" font-weight="700" font-size="11">✓ 6. Alertas Oficiales (SENAPRED / DMC)</text>
  </g>

  <!-- Bottom Timeline Player Bar -->
  <rect x="20" y="490" width="960" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="525" r="16" fill="#38bdf8"/>
  <polygon points="52,517 64,525 52,533" fill="#0f172a"/>

  <text x="86" y="521" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="12">Línea de Tiempo Operacional (+0h a +72h)</text>
  <text x="86" y="538" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Paso actual: +12h · Lluvia P50: 14.8 mm/h · Isoterma 0°C: 3.050 m</text>

  <!-- Progress Bar -->
  <rect x="470" y="520" width="480" height="8" rx="4" fill="#0f172a"/>
  <rect x="470" y="520" width="120" height="8" rx="4" fill="#38bdf8"/>
  <circle cx="590" cy="524" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <text x="470" y="542" fill="#64748b" font-family="monospace" font-size="10">Ahora (+0h)</text>
  <text x="575" y="542" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="10">+12h</text>
  <text x="700" y="542" fill="#64748b" font-family="monospace" font-size="10">+36h</text>
  <text x="915" y="542" fill="#64748b" font-family="monospace" font-size="10">+72h</text>
</svg>
