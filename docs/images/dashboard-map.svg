<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background & Shaders -->
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>

    <!-- Glass Panel Shader -->
    <linearGradient id="dashGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="dashBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Atmospheric River & Convective Storm Heatmaps -->
    <radialGradient id="plumeCore1" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plumeCore2" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#facc15" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="uiShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#dashBg)" rx="20"/>
  <rect width="1200" height="700" fill="url(#gridPattern)" rx="20"/>

  <!-- Main Window Shell (macOS Style) -->
  <rect x="25" y="20" width="1150" height="660" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Navigation & Control Bar -->
  <g transform="translate(25, 20)">
    <rect width="1150" height="62" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Brand Logo -->
    <circle cx="34" cy="31" r="16" fill="#0284c7" fill-opacity="0.2"/>
    <circle cx="34" cy="31" r="12" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <text x="27" y="37" fill="#0b132b" font-family="sans-serif" font-weight="900" font-size="14">🌧</text>
    <text x="62" y="37" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" letter-spacing="0.5">FloodChile</text>
    <text x="156" y="36" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">| Pronóstico &amp; Riesgo Hidrológico</text>

    <!-- Live Badge -->
    <rect x="365" y="18" width="118" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="380" cy="31" r="4.5" fill="#10b981" filter="url(#neonGlow)"/>
    <text x="393" y="35" fill="#34d399" font-family="monospace" font-weight="700" font-size="11">EN VIVO 15/15</text>

    <!-- Search Input Mockup -->
    <rect x="500" y="16" width="230" height="30" rx="8" fill="#0a0f1d" stroke="#334155"/>
    <text x="514" y="35" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">🔍 Buscar comuna o cuenca...</text>
    <rect x="696" y="21" width="24" height="20" rx="4" fill="#1e293b"/>
    <text x="702" y="35" fill="#64748b" font-family="monospace" font-size="10">⌘K</text>

    <!-- Action Buttons -->
    <rect x="742" y="16" width="96" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="754" y="35" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">📍 Cerca de mí</text>

    <rect x="846" y="16" width="104" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="858" y="35" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">🔗 Compartir</text>

    <rect x="958" y="16" width="170" height="30" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="972" y="35" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Modo Ciudadano ⇄ Técnico</text>
  </g>

  <!-- Left/Center Map Stage -->
  <g transform="translate(45, 96)">
    <!-- Base Map Container -->
    <rect width="760" height="470" rx="14" fill="#090f1e" stroke="#1e293b" stroke-width="1.2" filter="url(#uiShadow)"/>

    <!-- Map Grid lines (Coordinates) -->
    <line x1="0" y1="120" x2="760" y2="120" stroke="#1e293b" stroke-dasharray="4,4"/>
    <text x="715" y="115" fill="#475569" font-family="monospace" font-size="10">28°00' S</text>

    <line x1="0" y1="240" x2="760" y2="240" stroke="#1e293b" stroke-dasharray="4,4"/>
    <text x="715" y="235" fill="#475569" font-family="monospace" font-size="10">33°30' S</text>

    <line x1="0" y1="360" x2="760" y2="360" stroke="#1e293b" stroke-dasharray="4,4"/>
    <text x="715" y="355" fill="#475569" font-family="monospace" font-size="10">38°00' S</text>

    <!-- Stylized Chile Continental Silhouette with Andes Elevation -->
    <!-- Ocean Bathymetry Gradient (Pacific Shelf) -->
    <path d="M 120 40 Q 180 180 230 280 Q 270 380 320 460 L 0 460 L 0 40 Z" fill="#0369a1" fill-opacity="0.08"/>

    <!-- Mountain Relief Layer (Andes Cordillera) -->
    <path d="M 280 20 Q 320 150 360 270 Q 400 370 430 460 L 460 460 Q 420 370 380 270 Q 340 150 300 20 Z" fill="#1e293b" fill-opacity="0.6"/>

    <!-- Coastline Stroke -->
    <path d="M 220 20 Q 250 140 285 240 Q 320 340 355 460" fill="none" stroke="#64748b" stroke-width="32" stroke-linecap="round" opacity="0.4"/>
    <path d="M 220 20 Q 250 140 285 240 Q 320 340 355 460" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Atmospheric River & Convective Rainfall Heatmaps (Interactive Layer) -->
    <ellipse cx="280" cy="250" rx="140" ry="60" transform="rotate(-30, 280, 250)" fill="url(#plumeCore1)" filter="url(#neonGlow)"/>
    <ellipse cx="320" cy="320" rx="110" ry="50" transform="rotate(-26, 320, 320)" fill="url(#plumeCore2)" filter="url(#neonGlow)"/>

    <!-- 0°C Isotherm Contour line (Glowing Cyan) -->
    <path d="M 310 160 Q 355 240 380 320 Q 415 400 425 450" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" filter="url(#subtleGlow)"/>

    <!-- Floating Isotherm Badge -->
    <g transform="translate(390, 290)">
      <rect width="130" height="24" rx="6" fill="#0b132b" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)"/>
      <text x="22" y="16" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="10.5">Isoterma 3.050 m</text>
    </g>

    <!-- Radar Commune Pulse Markers -->
    <!-- Santiago (Maipo) -->
    <g transform="translate(290, 235)">
      <circle cx="0" cy="0" r="18" fill="#ef4444" fill-opacity="0.25" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <!-- Callout Tooltip Card -->
      <g transform="translate(18, -42)">
        <rect width="180" height="62" rx="8" fill="#0f172a" fill-opacity="0.96" stroke="#ef4444" stroke-width="1.2" filter="url(#uiShadow)"/>
        <text x="12" y="18" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="800" font-size="11.5">Santiago (Cuenca Maipo)</text>
        <text x="12" y="34" fill="#f8fafc" font-family="monospace" font-weight="700" font-size="11">Lluvia (muestra): 18.4 mm/h</text>
        <text x="12" y="50" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10">⚠️ Alerta Amarilla por Crecida</text>
      </g>
    </g>

    <!-- Valparaíso -->
    <g transform="translate(265, 215)">
      <circle cx="0" cy="0" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.8"/>
      <text x="-75" y="4" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-weight="600" font-size="10.5">Valparaíso</text>
    </g>

    <!-- Talca (Maule) -->
    <g transform="translate(315, 305)">
      <circle cx="0" cy="0" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="14" y="4" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="10.5">Talca (Maule)</text>
    </g>

    <!-- Concepción (Biobío) -->
    <g transform="translate(330, 365)">
      <circle cx="0" cy="0" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <text x="14" y="4" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="10.5">Concepción (Biobío)</text>
    </g>

    <!-- Map Overlay Controls (Zoom & Layers) -->
    <g transform="translate(20, 20)">
      <rect width="36" height="74" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="#334155"/>
      <text x="13" y="26" fill="#f8fafc" font-family="monospace" font-weight="700" font-size="16">+</text>
      <line x1="6" y1="37" x2="30" y2="37" stroke="#334155"/>
      <text x="14" y="58" fill="#f8fafc" font-family="monospace" font-weight="700" font-size="16">−</text>
    </g>

    <!-- Satellite Switcher Badge on Map -->
    <g transform="translate(20, 420)">
      <rect width="210" height="32" rx="8" fill="#0f172a" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🛰 Capa: NASA GIBS GOES-East IR</text>
    </g>
  </g>

  <!-- Right Floating HUD Panels -->
  <g transform="translate(825, 96)">
    <!-- Layer Toggles Glass Card -->
    <rect width="330" height="270" rx="14" fill="url(#dashGlass)" stroke="url(#dashBorder)" stroke-width="1.2" filter="url(#uiShadow)"/>
    <rect width="330" height="42" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <text x="18" y="27" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">6 Capas de Meteorología Operacional</text>

    <!-- Layer Items -->
    <g transform="translate(16, 54)">
      <!-- Item 1 (Active) -->
      <rect width="298" height="32" rx="6" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
      <text x="28" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Precipitación &amp; Río Atmosférico</text>
      <rect x="252" y="7" width="38" height="18" rx="9" fill="#38bdf8"/>
      <circle cx="279" cy="16" r="6" fill="#0f172a"/>

      <!-- Item 2 -->
      <g transform="translate(0, 38)">
        <rect width="298" height="32" rx="6" fill="#0a0f1d" stroke="#1e293b"/>
        <circle cx="16" cy="16" r="4" fill="#64748b"/>
        <text x="28" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Temperatura a 2m y Sensación</text>
        <rect x="252" y="7" width="38" height="18" rx="9" fill="#1e293b"/>
        <circle cx="262" cy="16" r="6" fill="#64748b"/>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 76)">
        <rect width="298" height="32" rx="6" fill="#0a0f1d" stroke="#1e293b"/>
        <circle cx="16" cy="16" r="4" fill="#64748b"/>
        <text x="28" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Viento a 10m y Rachas Máximas</text>
        <rect x="252" y="7" width="38" height="18" rx="9" fill="#1e293b"/>
        <circle cx="262" cy="16" r="6" fill="#64748b"/>
      </g>

      <!-- Item 4 (Active - Snow & Isotherm) -->
      <g transform="translate(0, 114)">
        <rect width="298" height="32" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#c084fc" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4" fill="#c084fc"/>
        <text x="28" y="20" fill="#c084fc" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Nieve e Isoterma 0 °C Andina</text>
        <rect x="252" y="7" width="38" height="18" rx="9" fill="#c084fc"/>
        <circle cx="279" cy="16" r="6" fill="#0f172a"/>
      </g>

      <!-- Item 5 (Active - Alerts) -->
      <g transform="translate(0, 152)">
        <rect width="298" height="32" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#f87171" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4" fill="#f87171"/>
        <text x="28" y="20" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">Alertas Oficiales (SENAPRED)</text>
        <rect x="252" y="7" width="38" height="18" rx="9" fill="#f87171"/>
        <circle cx="279" cy="16" r="6" fill="#0f172a"/>
      </g>
    </g>

    <!-- Telemetry Stats Card -->
    <g transform="translate(0, 286)">
      <rect width="330" height="184" rx="14" fill="url(#dashGlass)" stroke="url(#dashBorder)" stroke-width="1.2" filter="url(#uiShadow)"/>
      <rect width="330" height="38" rx="14" fill="#1e293b" fill-opacity="0.6"/>
      <text x="18" y="25" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="12.5">Métricas de Riesgo Hidrológico</text>

      <g transform="translate(16, 50)">
        <!-- Stat 1 -->
        <rect width="140" height="54" rx="8" fill="#0a0f1d" stroke="#1e293b"/>
        <text x="10" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Transporte Vapor (IVT)</text>
        <text x="10" y="42" fill="#f59e0b" font-family="monospace" font-weight="800" font-size="15">495 kg/m/s</text>

        <!-- Stat 2 -->
        <g transform="translate(158, 0)">
          <rect width="140" height="54" rx="8" fill="#0a0f1d" stroke="#1e293b"/>
          <text x="10" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Cota Isoterma 0 °C</text>
          <text x="10" y="42" fill="#ef4444" font-family="monospace" font-weight="800" font-size="15">3.050 m</text>
        </g>

        <!-- Stat 3 (Caudal) -->
        <g transform="translate(0, 62)">
          <rect width="298" height="54" rx="8" fill="#0a0f1d" stroke="#1e293b"/>
          <text x="12" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">Caudal Pronosticado Cuenca del Maipo (GloFAS)</text>
          <text x="12" y="42" fill="#38bdf8" font-family="monospace" font-weight="800" font-size="16">182 m³/s <tspan fill="#f59e0b" font-size="11">(+38% vs umbral)</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Timeline Scrubber with Embedded Hyetograph Sparkline -->
  <g transform="translate(45, 580)">
    <rect width="1110" height="82" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" filter="url(#uiShadow)"/>

    <!-- Play/Pause Button -->
    <circle cx="45" cy="41" r="22" fill="#0284c7" fill-opacity="0.2"/>
    <circle cx="45" cy="41" r="17" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <polygon points="41,33 53,41 41,49" fill="#0b132b"/>

    <!-- Timeline Label -->
    <text x="80" y="34" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="13">Línea de Tiempo Operacional (+0h a +72h)</text>
    <text x="80" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Paso actual: <tspan fill="#38bdf8" font-weight="700">+12h</tspan> · Simulación por pasos de modelo sin saltos ficticios</text>

    <!-- Embedded Mini Sparkline Chart behind track -->
    <g transform="translate(420, 20)">
      <!-- Mini Hyetograph Bars -->
      <rect x="10" y="16" width="12" height="6" rx="2" fill="#38bdf8" fill-opacity="0.4"/>
      <rect x="35" y="12" width="12" height="10" rx="2" fill="#38bdf8" fill-opacity="0.5"/>
      <rect x="60" y="8" width="12" height="14" rx="2" fill="#38bdf8" fill-opacity="0.6"/>
      <rect x="85" y="2" width="12" height="20" rx="2" fill="#f59e0b" fill-opacity="0.8"/>
      <rect x="110" y="0" width="12" height="22" rx="2" fill="#ef4444" fill-opacity="0.9"/>
      <rect x="135" y="4" width="12" height="18" rx="2" fill="#f59e0b" fill-opacity="0.8"/>
      <rect x="160" y="10" width="12" height="12" rx="2" fill="#38bdf8" fill-opacity="0.5"/>
      <rect x="185" y="15" width="12" height="7" rx="2" fill="#38bdf8" fill-opacity="0.4"/>

      <!-- Progress Track -->
      <rect x="0" y="26" width="650" height="8" rx="4" fill="#090f1e"/>
      <rect x="0" y="26" width="150" height="8" rx="4" fill="#38bdf8" filter="url(#subtleGlow)"/>

      <!-- Glowing Slider Knob -->
      <circle cx="150" cy="30" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" filter="url(#subtleGlow)"/>
      <circle cx="150" cy="30" r="3.5" fill="#0b132b"/>

      <!-- Hour markers -->
      <text x="0" y="50" fill="#64748b" font-family="monospace" font-size="10.5">Ahora (+0h)</text>
      <text x="132" y="50" fill="#38bdf8" font-family="monospace" font-weight="800" font-size="11">+12h</text>
      <text x="310" y="50" fill="#64748b" font-family="monospace" font-size="10.5">+36h</text>
      <text x="480" y="50" fill="#64748b" font-family="monospace" font-size="10.5">+60h</text>
      <text x="615" y="50" fill="#64748b" font-family="monospace" font-size="10.5">+72h</text>
    </g>
  </g>
</svg>
